<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ImageForge">
	<!--
		ImageForge 彩色标识（圆角徽章）。
		用于"关于"弹窗、favicon 与 PWA 图标；不要用于页面左上角
		（那里需要单色版本 images/logo.svg 以便跟随主题反色）。
	-->
	<defs>
		<linearGradient id="if-forge" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#3B82F6" />
			<stop offset="100%" stop-color="#7C3AED" />
		</linearGradient>
	</defs>

	<rect width="64" height="64" rx="14" fill="url(#if-forge)" />

	<g transform="translate(32 32) scale(0.68) translate(-32 -32)">
		<g fill="#ffffff">
			<path d="M6 48 L23 24 L33 37 L40 28 L58 48 Z" />
			<rect x="6" y="51" width="52" height="4" rx="2" fill-opacity="0.85" />
			<path d="M44 8 C44.9 14.1 46.9 16.1 53 17 C46.9 17.9 44.9 19.9 44 26 C43.1 19.9 41.1 17.9 35 17 C41.1 16.1 43.1 14.1 44 8 Z" />
		</g>
	</g>
</svg>
