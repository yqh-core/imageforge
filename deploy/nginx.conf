# ImageForge - Nginx 部署示例
#
# 用法：把 root 改成你的实际目录，然后
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/imageforge.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键点：gzip_static / brotli_static 让服务器直接返回构建时生成好的 .gz / .br，
# 不再每次请求现场压缩。没开这两项功能也完全正常，只是白丢了 4 倍体积优势。

server {
	listen 80;
	listen [::]:80;
	# 生产环境建议 443 + TLS，并把 80 全量 301 过去（证书路径按实际域名替换）
	# listen 443 ssl http2;
	# ssl_certificate     /etc/letsencrypt/live/你的域名/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/你的域名/privkey.pem;

	# 自建服务器时改成你实际绑定的域名
	server_name online-drawing.pages.dev;

	root /var/www/imageforge;
	index index.html;

	charset utf-8;
	charset_types text/css application/javascript application/json image/svg+xml;
	server_tokens off;

	# ---------------------------------------------------------------- 预压缩
	# gzip_static: 官方 nginx 包默认已编译进 --with-http_gzip_static_module
	gzip_static on;
	gzip_vary on;

	# brotli_static: 需要自己编译 ngx_brotli 模块；没装就注释掉
	# brotli_static on;
	# brotli_types text/css application/javascript application/json image/svg+xml;

	# 兜底：万一没有预压缩产物，现场压缩
	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
		text/plain text/css text/xml
		application/javascript application/json application/xml
		application/manifest+json image/svg+xml;

	# ---------------------------------------------------------------- 缓存策略
	# 带内容指纹的构建产物：可以永久缓存。
	# 失效靠 index.html 里 dist/bundle.js?v=<内容指纹> 的 URL 变化，不是靠过期时间。
	location ^~ /dist/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		access_log off;
	}

	# 图标 / 图片：文件名不含指纹，用中等时长
	location ^~ /images/ {
		expires 30d;
		add_header Cache-Control "public, max-age=2592000" always;
		access_log off;
	}

	# HTML 必须每次回源校验，否则用户会一直拿到指向旧 bundle 的旧页面
	location = /index.html {
		add_header Cache-Control "no-cache" always;
	}

	# PWA 清单也一样，改名后要及时生效
	location = /manifest.webmanifest {
		types { } default_type application/manifest+json;
		add_header Cache-Control "no-cache" always;
	}

	# Service Worker 必须每次回源：它决定了用户什么时候能看到新版本。
	# 给了长缓存，站点发版后用户可能几十小时都拿不到更新。
	location = /service-worker.js {
		add_header Cache-Control "no-cache" always;
	}

	# 根目录的传统图标。地址栏 / 书签 / 爬虫会无条件请求 /favicon.ico，
	# 缺了它就会被下面的 try_files 兜底成一个 HTML 页面。
	location = /favicon.ico {
		expires 30d;
		add_header Cache-Control "public, max-age=2592000" always;
		access_log off;
		log_not_found off;
	}

	# ---------------------------------------------------------------- 路由
	# 站内没有前端路由，正常静态命中即可；
	# try_files 兜底是为了让 /about 这类误入链接也能回到应用而不是 404 页面。
	location / {
		try_files $uri $uri/ /index.html;
	}

	# ---------------------------------------------------------------- 错误页
	# 这一条是必需的，不是装饰：上面 try_files 会让**所有**未命中路径都以 200
	# 返回 index.html（软 404）。搜索引擎会把它们当成一堆内容重复的页面收录。
	# 配上 404.html 之后，未命中路径才会带上真正的 404 状态码。
	error_page 404 /404.html;

	location = /404.html {
		add_header Cache-Control "no-cache" always;
	}

	# ---------------------------------------------------------------- 安全响应头
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
	# 注意：刻意不设 X-Frame-Options —— examples/ 里的集成示例需要用 iframe 嵌入本应用。

	# CSP 默认不开启是刻意的。这个应用通过 JS 注入 <style>、使用 blob:/data: 图片、
	# 并会访问 pixabay.com（图片搜索）与 fonts.googleapis.com（可选字体）。
	# 直接套一份严格 CSP 会直接打断功能。要开请先按下面这份放开验证：
	#
	# add_header Content-Security-Policy "
	#     default-src 'self';
	#     script-src 'self';
	#     style-src 'self' 'unsafe-inline';
	#     img-src 'self' data: blob: https://pixabay.com https://cdn.pixabay.com;
	#     connect-src 'self' https://pixabay.com;
	#     font-src 'self' data: https://fonts.gstatic.com;
	#     frame-ancestors 'self';
	# " always;

	# ---------------------------------------------------------------- 杂项
	location = /robots.txt { access_log off; log_not_found off; }
	location = /sitemap.xml { access_log off; }

	# 这些目录只用于开发，生产环境应该根本没上传；万一上传了就拒绝访问
	location ~ ^/(src|scripts|node_modules|vendor|tools)/ {
		deny all;
		return 404;
	}
}
