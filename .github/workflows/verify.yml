name: Verify ImageForge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Cloudflare artifact
        run: npm run ship:cloudflare

      - name: Verify consent-gated GA4 and CSP
        run: npm run check:ga4-consent
