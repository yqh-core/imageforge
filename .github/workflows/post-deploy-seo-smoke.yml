name: Post-deploy SEO smoke

on:
  workflow_run:
    workflows: ["Build and verify"]
    types: [completed]

permissions:
  contents: read
  checks: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Cloudflare Git deployment and verify crawler-facing pages
        env:
          SITE_ORIGIN: "https://draw.digdevbox.com"
          EXPECTED_TITLE: "ImageForge - Free Online Photo & Image Editor"
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.SITE_ORIGIN;
          const expectedTitle = process.env.EXPECTED_TITLE;
          const ua = 'Googlebot/2.1 (+http://www.google.com/bot.html)';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          // Wait for the Cloudflare Pages check belonging to this exact source commit.
          const targetSha = process.env.TARGET_SHA;
          const checksUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/commits/' + targetSha + '/check-runs';
          let cloudflareReady = false;
          for (let attempt = 1; attempt <= 90; attempt++) {
            const response = await fetch(checksUrl, {
              headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('GitHub check-run API returned HTTP ' + response.status);
            const payload = await response.json();
            const check = (payload.check_runs || []).find((item) =>
              item.name === 'Cloudflare Pages' && item.head_sha === targetSha
            );
            if (check?.status === 'completed') {
              if (check.conclusion !== 'success') {
                throw new Error('Cloudflare Pages deployment concluded ' + check.conclusion +
                  ': ' + (check.details_url || 'no details URL'));
              }
              cloudflareReady = true;
              console.log('Cloudflare Pages deployment succeeded for exact commit ' + targetSha);
              break;
            }
            console.log('Waiting for exact Cloudflare deployment (' + attempt + '/90): ' +
              (check?.status || 'check not created'));
            await sleep(10000);
          }
          if (!cloudflareReady) throw new Error('Exact Cloudflare Pages deployment did not complete within 15 minutes');

          async function get(path) {
            const response = await fetch(origin + path, {
              redirect: 'follow',
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
            });
            return { response, body: await response.text() };
          }

          let home = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            try {
              const result = await get('/');
              if (result.response.ok && result.body.includes(expectedTitle) && result.body.includes('rel="canonical"')) {
                home = result;
                console.log(`Production homepage ready (attempt ${attempt})`);
                break;
              }
              console.log(`Waiting for deployment (${attempt}/20): HTTP ${result.response.status}`);
            } catch (error) {
              console.log(`Waiting for origin (${attempt}/20): ${error.message}`);
            }
            await sleep(15000);
          }
          if (!home) throw new Error('Production homepage did not expose expected SEO HTML within 5 minutes');

          const robots = await get('/robots.txt');
          if (!robots.response.ok || !/Sitemap:\s*https:\/\//i.test(robots.body)) {
            throw new Error('robots.txt missing an absolute HTTPS Sitemap directive');
          }
          const sitemap = await get('/sitemap.xml');
          if (!sitemap.response.ok || !sitemap.body.includes('<urlset')) {
            throw new Error('sitemap.xml did not return a valid URL set');
          }

          const expectedRoutes = ["/","/guides","/faq","/about","/contact","/privacy","/terms"];
          for (const route of expectedRoutes) {
            const url = origin + (route === '/' ? '/' : route);
            if (!sitemap.body.includes(url)) throw new Error('sitemap missing ' + url);
          }

          const pages = ["/guides","/faq","/about","/contact","/privacy","/terms"];
          for (const path of pages) {
            const result = await get(path);
            if (!result.response.ok || !result.body.includes('rel="canonical"')) {
              throw new Error(`${path}: expected HTTP 200 and canonical metadata, got ${result.response.status}`);
            }
            if (/href=["']https:\/\/(?:fangdai|geek-typing)\.digdevbox\.com\//i.test(result.body)) {
              throw new Error(path + ': deferred China-only product link remains on this English page');
            }
            if (result.body.includes('href="https://digdevbox.com/')) {
              throw new Error(path + ': stale bare-domain internal link remains');
            }
          }

          const networkLinks = [
            'https://www.digdevbox.com/',
            'https://img.digdevbox.com/',
            'https://ip.digdevbox.com/',
            'https://play.digdevbox.com/',
            'https://ttsreader.digdevbox.com/',
            'https://notes.digdevbox.com/',
          ];
          const missingNetworkLinks = networkLinks.filter((url) => !home.body.includes(url));
          if (missingNetworkLinks.length) {
            throw new Error('Product network links missing from homepage: ' + missingNetworkLinks.join(', '));
          }
          if (/href=["']https:\/\/(?:fangdai|geek-typing)\.digdevbox\.com\//i.test(home.body)) {
            throw new Error('Deferred China-only product link remains on the English product site');
          }

          console.log('PASS: homepage, product network links, robots.txt, sitemap.xml and selected static routes are live and crawlable');
          NODE
